[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-in-the-logs"
version = "0.1.0"
description = "AI incident investigator powered by local LLMs"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ghost in the Logs Contributors"}]
readme = "README.md"
keywords = ["observability", "incident-response", "llm", "loki", "prometheus"]

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "drain3>=0.9.11",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "prometheus-client>=0.20.0",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "sse-starlette>=2.1.0",
    "anyio>=4.3.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "requests>=2.31.0",
    "aiofiles>=23.2.1",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "faker>=25.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ghost*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
