global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "service"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 5m
  receiver: ghost_webhook

receivers:
  - name: ghost_webhook
    webhook_configs:
      - url: "http://ghost:8000/webhook/alert"
        send_resolved: true
        http_config:
          follow_redirects: true
          authorization:
            type: Bearer
            # Keep in sync with ALERT_WEBHOOK_SECRET in the Ghost environment.
            credentials: changeme
        max_alerts: 10

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname", "service"]
