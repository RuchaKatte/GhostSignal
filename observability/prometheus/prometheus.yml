global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: gateway
    static_configs:
      - targets: ["gateway:8001"]
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: orders-api
    static_configs:
      - targets: ["orders-api:8002"]
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: payments-worker
    static_configs:
      - targets: ["payments-worker:8003"]
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: ghost
    static_configs:
      - targets: ["ghost:8000"]
    metrics_path: /metrics
    scrape_interval: 15s
